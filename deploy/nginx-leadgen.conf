# /etc/nginx/sites-available/leadgen  (replace leadgen.example.com and the repo path)
# Then: ln -s /etc/nginx/sites-available/leadgen /etc/nginx/sites-enabled/ && nginx -t && systemctl reload nginx
#       certbot --nginx -d leadgen.example.com

limit_req_zone $binary_remote_addr zone=leadgen_api:10m rate=20r/s;

server {
    listen 80;
    server_name leadgen.example.com;

    root /var/www/ai-leadgen/web/dist;
    index index.html;

    client_max_body_size 5m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;

    # API + n8n callbacks + Razorpay webhook
    location /api/ {
        limit_req zone=leadgen_api burst=40 nodelay;
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Links inside emails: unsubscribe pages and open-tracking pixel
    location ~ ^/(u|t)/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Website analyzer, exposed only so n8n can reach it (token-protected).
    # Remove this block if n8n runs on this same server and uses http://127.0.0.1:8000.
    location /analyzer/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # React SPA
    location / {
        try_files $uri /index.html;
    }
}
